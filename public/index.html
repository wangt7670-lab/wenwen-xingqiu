<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>問問星球</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./v5.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="identity v5-brand" href="./"><span class="brand-logo" aria-hidden="true"><span class="orbit-star">✦</span><span class="orb-core"></span></span><strong>問問星球</strong></a>
      <button type="button" class="button subtle hidden" id="sign-out">登出</button>
    </header>
    <main>
      <p id="v5-status" role="status" hidden></p>
      <section class="feature-card v5-login" id="v5-login">
        <h1>登入你的問問星球</h1>
        <form id="sign-in">
          <div class="field"><label for="account">帳號或電郵</label><input id="account" name="account" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
          <div class="field"><label for="password">密碼</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
          <button class="button primary" type="submit" disabled>登入</button>
        </form>
      </section>
      <section id="v5-app" class="hidden">
        <section class="hero" id="v5-home">
          <div class="hero-copy">
            <h1>距離很遠，<br><em>好奇心</em>卻可以很近。</h1>
            <p id="v5-greeting"></p>
            <div class="hero-actions">
              <button type="button" class="button primary" data-screen="quiz">考考你</button>
              <button type="button" class="button subtle" data-screen="performance">請開始你的表演</button>
            </div>
          </div>
          <div class="hero-art" aria-hidden="true"><div class="dotted-orbit"></div><div class="planet-1"><div class="planet-face"><i></i><i></i><span></span></div></div><div class="planet-2"><div class="planet-face"><i></i><i></i><span></span></div></div><div class="float-heart">♥</div></div>
        </section>
        <section id="v5-overview" class="v5-overview"></section>
        <section id="v5-module" class="hidden">
          <button class="link-button" type="button" data-screen="home">← 首頁</button>
          <div class="section-heading"><h1 id="v5-module-title"></h1></div>
          <div id="v5-compose" class="feature-card"></div>
          <p><button class="button subtle hidden" id="v5-admin-toggle" type="button" aria-controls="v5-admin" aria-expanded="false">管理題庫</button></p>
          <section id="v5-admin" class="hidden feature-card" aria-label="題庫管理"></section>
          <div id="v5-thread-list" class="v5-threads"></div>
          <div id="v5-pagination" class="planet-actions"></div>
        </section>
      </section>
    </main>
    <footer>問問星球 · 把每一次提問，變成靠近彼此的理由。</footer>
  </div>
  <script type="module" src="./v5.js"></script>
</body>
</html>
